[project]
name = "telegram-mcp-agent"
version = "0.1.0"
description = "Telegram assistant that reaches Gmail and Google Calendar through an MCP server, with Postgres memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "python-telegram-bot>=21.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
